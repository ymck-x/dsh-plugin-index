<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>DSH 插件索引</title>
<style>
/* ── Linear 风格基础 ────────────────────────────────────────────
   要点：近黑而非纯黑；边框用半透明而不是实色；文字按用途分三层对比度；
   彩色只出现在品牌强调和状态提示上。 */
:root{
  --bg:#08090a;
  --bg-panel:#101113;
  --bg-row:#0e0f11;
  --bg-hover:#16181a;
  --border:rgba(255,255,255,.08);
  --border-strong:rgba(255,255,255,.14);
  --fg:#f7f8f8;
  --fg-muted:#8a8f98;
  --fg-faint:#62666d;
  --accent:#5e6ad2;
  --accent-soft:rgba(94,106,210,.14);
  --warn:#d4a25a;
  --ok:#5cb87a;
  --shadow:0 1px 2px rgba(0,0,0,.5);
  --radius:8px;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#fbfbfb;
    --bg-panel:#ffffff;
    --bg-row:#ffffff;
    --bg-hover:#f4f5f6;
    --border:rgba(0,0,0,.08);
    --border-strong:rgba(0,0,0,.14);
    --fg:#1a1b1e;
    --fg-muted:#6b6f76;
    --fg-faint:#9a9ea6;
    --accent:#5e6ad2;
    --accent-soft:rgba(94,106,210,.1);
    --warn:#9a6a1a;
    --ok:#2f7d4f;
    --shadow:0 1px 2px rgba(0,0,0,.06);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--fg);
  font:14px/1.55 "Inter var",Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  font-feature-settings:"cv01","ss03";
}
a{color:inherit;text-decoration:none}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}

/* ── 顶部 ─────────────────────────────────────────── */
header{padding:44px 0 0}
.brandline{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
h1{font-size:20px;font-weight:590;margin:0;letter-spacing:-.02em}
.tagline{color:var(--fg-muted);font-size:13.5px;margin:0 0 28px;max-width:60ch}
.stats{display:flex;gap:32px;flex-wrap:wrap;padding-bottom:26px}
.stat b{display:block;font-size:19px;font-weight:560;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{color:var(--fg-faint);font-size:12px}

/* ── 工具条 ───────────────────────────────────────── */
.toolbar{
  position:sticky;top:0;z-index:20;
  display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  padding:12px 0;margin-bottom:4px;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}
input,select{
  font:inherit;font-size:13.5px;color:var(--fg);background:var(--bg-panel);
  border:1px solid var(--border);border-radius:6px;padding:8px 11px;outline:none;
  transition:border-color .12s,background .12s;
}
input:focus,select:focus{border-color:var(--border-strong);background:var(--bg-hover)}
input::placeholder{color:var(--fg-faint)}
input[type=search]{flex:1 1 260px;min-width:0}
select{cursor:pointer;appearance:none;padding-right:30px;
  background-image:linear-gradient(45deg,transparent 50%,var(--fg-faint) 50%),linear-gradient(135deg,var(--fg-faint) 50%,transparent 50%);
  background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.meta{color:var(--fg-faint);font-size:12.5px;margin:14px 0 10px;font-variant-numeric:tabular-nums}

/* ── 列表 ─────────────────────────────────────────── */
.list{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--bg-row)}
.row{
  display:flex;align-items:center;gap:16px;
  padding:12px 16px;border-bottom:1px solid var(--border);
  transition:background .1s;
}
.row:last-child{border-bottom:0}
.row:hover{background:var(--bg-hover)}
.row-main{flex:1;min-width:0}
.row-title{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.row-title b{font-weight:530;font-size:14px;letter-spacing:-.01em}
.row-title span{color:var(--fg-faint);font-size:12.5px}
.row-desc{color:var(--fg-muted);font-size:13px;margin-top:1px;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.row-side{display:flex;align-items:center;gap:10px;flex-shrink:0}
.chip{font-size:11.5px;padding:2px 7px;border-radius:5px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.warn{background:transparent;color:var(--warn);border:1px solid var(--border-strong)}
.stars{color:var(--fg-faint);font-size:12.5px;font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.stars.hot{color:var(--fg-muted);font-weight:520}
.copy{
  font:inherit;font-size:12px;color:var(--fg-muted);background:transparent;
  border:1px solid var(--border);border-radius:6px;padding:4px 11px;cursor:pointer;
  transition:all .12s;white-space:nowrap;
}
.copy:hover{color:var(--fg);border-color:var(--border-strong);background:var(--bg-hover)}
.copy.done{color:var(--ok);border-color:transparent;background:transparent}

.more{display:flex;justify-content:center;margin:20px 0 56px}
.more button{
  font:inherit;font-size:13.5px;color:var(--fg-muted);background:var(--bg-panel);
  border:1px solid var(--border);border-radius:6px;padding:9px 22px;cursor:pointer;transition:all .12s;
}
.more button:hover{color:var(--fg);border-color:var(--border-strong);background:var(--bg-hover)}

.empty{padding:80px 0;text-align:center;color:var(--fg-faint);font-size:13.5px}

footer{border-top:1px solid var(--border);color:var(--fg-faint);font-size:12.5px;padding:22px 0 48px}
footer p{margin:0 0 7px;max-width:78ch}
footer code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--fg-muted);
  background:var(--bg-panel);border:1px solid var(--border);border-radius:4px;padding:1px 5px}

@media(max-width:720px){
  header{padding:28px 0 0}
  .stats{gap:22px}
  .row{flex-wrap:wrap;gap:8px}
  .row-side{width:100%;justify-content:flex-start}
  .wrap{padding:0 16px}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brandline"><span class="dot"></span><h1>DSH 插件索引</h1></div>
    <p class="tagline">按硬证据校验的 DeepSeek Harness 插件目录。判定依据是每个包 <code>package.json</code> 里的 <code>dsh.bundle.patch</code> 声明。</p>
    <div class="stats" id="stats"></div>
  </div>
</header>

<div class="wrap">
  <div class="toolbar">
    <input id="q" type="search" placeholder="搜索仓库、包名、描述…" autocomplete="off" spellcheck="false">
    <select id="cat"><option value="all">全部分类</option></select>
    <select id="stars">
      <option value="0">星数不限</option>
      <option value="10">10 星以上</option>
      <option value="50">50 星以上</option>
      <option value="200">200 星以上</option>
    </select>
    <select id="sort">
      <option value="default">按证据强度</option>
      <option value="stars">按星数</option>
      <option value="name">按名称</option>
    </select>
  </div>
  <div class="meta" id="count"></div>
  <div class="list" id="list"></div>
  <div class="more" id="moreWrap" hidden><button id="more">加载更多</button></div>
</div>

<footer>
  <div class="wrap">
    <p id="meta"></p>
    <p>安装地址优先锁定到 tag 或 commit，避免「跟随分支」——那种地址在作者推送新代码后会让本地校验失败。</p>
    <p>数据由服务器上的 <code>dsh-index</code> 管道生成，与应用 DSH 的机器无关。</p>
  </div>
</footer>

<script>
const PAGE = 60;
const PINNED = ['npm','tag','commit'];
const state = { data: [], shown: [], limit: PAGE };

const el = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const repoName = (f) => String(f||'').split('/').pop() || String(f||'');
const repoOwner = (f) => String(f||'').split('/')[0] || '';
const installCmd = (p) => 'dsh plugin --profile desktop add ' + p.s;

function render(){
  const list = el('list');
  const slice = state.shown.slice(0, state.limit);

  if (!slice.length){
    list.style.border = '0';
    list.innerHTML = '<div class="empty">没有匹配的插件</div>';
    el('moreWrap').hidden = true;
    el('count').textContent = '';
    return;
  }
  list.style.border = '';

  list.innerHTML = slice.map((p, i) => {
    const hot = (p.st || 0) >= 50 ? ' hot' : '';
    const chips = [];
    if (p.g) chips.push('<span class="chip">' + esc(p.g) + '</span>');
    if (!PINNED.includes(p.k)) chips.push('<span class="chip warn">地址跟随分支</span>');

    return '<div class="row">'
      + '<div class="row-main">'
      +   '<div class="row-title">'
      +     '<b><a href="https://github.com/' + esc(p.r) + '" target="_blank" rel="noopener">' + esc(repoName(p.r)) + '</a></b>'
      +     '<span>' + esc(repoOwner(p.r)) + (p.v ? ' · v' + esc(p.v) : '') + '</span>'
      +   '</div>'
      +   (p.d ? '<div class="row-desc">' + esc(p.d) + '</div>' : '')
      + '</div>'
      + '<div class="row-side">'
      +   chips.join('')
      +   '<span class="stars' + hot + '">' + (p.st || 0) + '</span>'
      +   '<button class="copy" data-i="' + i + '" title="' + esc(installCmd(p)) + '">复制</button>'
      + '</div>'
      + '</div>';
  }).join('');

  el('count').textContent = '匹配 ' + state.shown.length.toLocaleString() + ' 个 · 已显示 ' + slice.length.toLocaleString() + ' 个';
  el('moreWrap').hidden = state.shown.length <= state.limit;
}

function apply(){
  const q = el('q').value.trim().toLowerCase();
  const cat = el('cat').value;
  const minStars = Number(el('stars').value) || 0;
  const sort = el('sort').value;

  let list = state.data.filter((p) => {
    if (cat !== 'all' && p.g !== cat) return false;
    if (minStars > 0 && (p.st || 0) < minStars) return false;
    if (!q) return true;
    return [p.r, p.n, p.d, p.g].join(' ').toLowerCase().includes(q);
  });

  if (sort === 'stars') list = list.slice().sort((a,b) => (b.st||0) - (a.st||0));
  else if (sort === 'name') list = list.slice().sort((a,b) => repoName(a.r).localeCompare(repoName(b.r)));

  state.shown = list;
  state.limit = PAGE;
  render();
}

el('list').addEventListener('click', (e) => {
  const btn = e.target.closest('button.copy');
  if (!btn) return;
  const p = state.shown[Number(btn.dataset.i)];
  if (!p) return;
  const done = () => { btn.textContent = '已复制'; btn.classList.add('done');
    setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('done'); }, 1500); };
  if (navigator.clipboard) navigator.clipboard.writeText(installCmd(p)).then(done).catch(() => { btn.textContent = '失败'; });
  else { btn.textContent = '不支持'; }
});

el('more').addEventListener('click', () => { state.limit += PAGE; render(); });
['q','cat','stars','sort'].forEach((id) => {
  el(id).addEventListener('input', apply);
  el(id).addEventListener('change', apply);
});

fetch('data.json', { cache: 'no-cache' }).then((r) => {
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}).then((payload) => {
  const plugins = payload.plugins || [];
  state.data = plugins;

  const total = plugins.length;
  const hot = plugins.filter((p) => (p.st || 0) >= 50).length;
  const pinned = plugins.filter((p) => PINNED.includes(p.k)).length;

  el('stats').innerHTML =
      '<div class="stat"><b>' + total.toLocaleString() + '</b><span>收录插件</span></div>'
    + '<div class="stat"><b>' + hot.toLocaleString() + '</b><span>50 星以上</span></div>'
    + '<div class="stat"><b>' + pinned.toLocaleString() + '</b><span>地址已锁定</span></div>';

  const cats = new Map();
  plugins.forEach((p) => cats.set(p.g || '其他', (cats.get(p.g || '其他') || 0) + 1));
  const sel = el('cat');
  [...cats.entries()].sort((a,b) => b[1] - a[1]).forEach(([name, n]) => {
    const o = document.createElement('option');
    o.value = name; o.textContent = name + '（' + n + '）';
    sel.appendChild(o);
  });

  el('meta').textContent = '清单生成于 ' + (payload.generated_at || '未知')
    + ' · 共 ' + (payload.counts_total || '?') + ' 条候选，其中 ' + total.toLocaleString() + ' 条通过校验'
    + ' · 排序按证据强度而非星数';

  apply();
}).catch((err) => {
  el('list').innerHTML = '<div class="empty">加载清单失败：' + esc(err.message) + '</div>';
});
</script>
</body>
</html>
